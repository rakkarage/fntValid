<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>fntValid</title>
	<style>
		:root {
			--bg: #faf8f4;
			--card: #fff;
			--ink: #222;
			--mut: #666;
			--line: #ddd;
			--acc: #7a3ff0;
			--g: #1a9a4a;
			--b: #2b6fe0;
			--o: #e07a10;
			--r: #d03030;
			--p: #7a3ff0;
			box-sizing: border-box;
			padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0)
		}

		@media(prefers-color-scheme:dark) {
			:root:not([data-theme="light"]) {
				--bg: #17161a;
				--card: #222126;
				--ink: #eee;
				--mut: #aaa;
				--line: #38363d;
				--acc: #a98aff;
				--g: #4ed17f;
				--b: #6ea2ff;
				--o: #ffa04a;
				--r: #ff6b6b;
				--p: #a98aff
			}
		}

		:root[data-theme="dark"] {
			--bg: #17161a;
			--card: #222126;
			--ink: #eee;
			--mut: #aaa;
			--line: #38363d;
			--acc: #a98aff;
			--g: #4ed17f;
			--b: #6ea2ff;
			--o: #ffa04a;
			--r: #ff6b6b;
			--p: #a98aff
		}

		body {
			margin: 0;
			background: var(--bg);
			color: var(--ink);
			font: 14px/1.45 system-ui, sans-serif
		}

		main {
			max-width: 1400px;
			margin: 0 auto;
			padding: 12px;
			columns: 420px;
			column-gap: 10px
		}

		.card {
			background: var(--card);
			border: 1px solid var(--line);
			border-radius: 8px;
			padding: 10px;
			margin: 0 0 10px;
			break-inside: avoid
		}

		.row {
			display: flex;
			gap: 10px;
			flex-wrap: wrap
		}

		.row>* {
			flex: 1 1 220px;
			min-width: 0
		}

		canvas {
			image-rendering: pixelated;
			max-width: 100%;
			border: 1px solid var(--line);
			border-radius: 4px;
			background: var(--bg)
		}

		.sc {
			overflow-x: auto
		}

		code,
		.k {
			font-family: ui-monospace, monospace;
			font-size: .9em;
			background: var(--bg);
			padding: 1px 4px;
			border-radius: 4px
		}

		.dot {
			display: inline-block;
			width: 10px;
			height: 10px;
			border-radius: 50%;
			margin-right: 4px;
			vertical-align: middle
		}

		button,
		input,
		select,
		textarea {
			font: inherit;
			color: var(--ink);
			background: var(--card);
			border: 1px solid var(--line);
			border-radius: 6px;
			padding: 4px 8px
		}

		button {
			cursor: pointer;
			background: color-mix(in srgb, var(--acc) 12%, var(--card));
			border-color: color-mix(in srgb, var(--acc) 45%, var(--line));
			font-weight: 600;
			box-shadow: 0 1px 0 rgba(0, 0, 0, .06)
		}

		button:hover {
			background: color-mix(in srgb, var(--acc) 22%, var(--card));
			border-color: var(--acc)
		}

		button:active {
			transform: translateY(1px)
		}

		input[type=number] {
			width: 56px
		}

		textarea {
			width: 100%;
			box-sizing: border-box;
			font-family: ui-monospace, monospace;
			font-size: .78rem
		}

		#grid {
			display: flex;
			flex-wrap: wrap;
			gap: 4px;
			max-height: 160px;
			overflow: auto
		}

		#grid button {
			flex: 1 0 2.2em;
			min-width: 2.2em;
			height: 2em;
			padding: 0 .2em;
			font-family: ui-monospace, monospace
		}

		#grid button.on {
			background: var(--acc);
			color: #fff;
			border-color: var(--acc)
		}

		label {
			display: inline-flex;
			gap: 4px;
			align-items: center;
			margin: 2px 6px 2px 0
		}

		.mut {
			color: var(--mut)
		}

		.warn {
			color: var(--o)
		}

		p {
			margin: .35em 0
		}

		hr {
			border: 0;
			border-top: 1px solid var(--line);
			margin: 8px 0
		}
	</style>
</head>

<body>
	<main>
		<div class="card">
			<div class="row">
				<div>
					<p id="anaInfo"></p>
				</div>
				<div class="sc"><canvas id="anat"></canvas></div>
				<div>
					<p><span class="dot" style="background:var(--r)"></span>top</p>
					<p><span class="dot" style="background:var(--g)"></span>base <code id="vb"></code></p>
					<p><span class="dot" style="background:var(--b)"></span>lineHeight <code id="vl"></code></p>
					<p><span class="dot" style="background:var(--o)"></span>bottom <code>yoffset + height</code></p>
					<p><span class="dot" style="background:var(--p)"></span>xadvance <code id="xa"></code></p>
				</div>
			</div>
		</div>

		<div class="card" id="settings">
			<div id="grid"></div>
			<p id="selinfo" class="mut"></p>
			<label>yoffset <input type="number" id="iyo"></label>
			<label>xoffset <input type="number" id="ixo"></label>
			<label>xadvance <input type="number" id="ixa"></label>
			<button id="up">▲</button> <button id="dn">▼</button>
			<hr>
			<select id="grp">
				<option value="all">all</option>
				<option value="up">A–Z</option>
				<option value="low">a–z</option>
				<option value="desc">descenders g j p q y</option>
				<option value="nodesc">a–z no descenders</option>
				<option value="dig">0–9</option>
				<option value="pun">punctuation</option>
			</select>
			<label>Δy <input type="number" id="dy" value="-1"></label><button id="apply">Apply</button>
			<label>base <input type="number" id="ibase"></label><label>lineHeight <input type="number" id="ilh"></label>
		</div>

		<div class="card">
			<b>Checks</b> <span id="sum" class="mut"></span><br>
			<label>descenders <input id="dset" value="gjpqy" size="6"></label><br>
			<button id="fixb">Snap to baseline</button> <button id="fixl">Fit lineHeight</button><br>
			<label>top gap <input type="number" id="top" value="0"></label><label>bottom gap <input type="number"
					id="gap" value="0"></label><button id="norm">Normalize</button>
			<div id="chk"></div>
		</div>

		<div class="card">
			<label>Preview <input id="txt" size="28" value="Hag Jyp 0123 Quick fox, jumps!"></label>
			<label>zoom <select id="zm">
					<option>2</option>
					<option selected>4</option>
					<option>6</option>
				</select></label>
			<label><input type="checkbox" id="gd" checked> guides</label>
			<div class="sc"><canvas id="prev"></canvas></div>
			<p class="mut">Click atlas to select:</p>
			<div class="sc"><canvas id="atlas"></canvas></div>
		</div>

		<div class="card">
			<textarea id="fnt" rows="8" spellcheck="false" placeholder="Paste .fnt here"></textarea>
			<p><button id="load">Load .fnt</button> <button id="exp">Export</button> <button id="cp">Copy</button>
				<label>PNG <input type="file" id="png" accept="image/png"></label>
			</p>
		</div>
	</main>
	<script>
		const IMG = "Font/Venice16.png";
		const D = "32,32,63,5,12,3,5;33,98,42,4,12,3,4;34,151,54,6,5,2,6;35,114,42,10,10,4,10;36,108,17,7,13,3,7;37,65,30,11,12,3,11;38,14,30,13,12,3,13;39,162,54,3,5,2,3;40,60,0,6,14,2,6;41,54,0,6,14,2,6;42,124,54,8,7,6,8;43,73,54,9,9,5,9;44,132,54,4,6,11,4;45,23,63,9,3,8,9;46,8,63,4,4,11,4;47,92,17,8,13,3,8;48,60,42,8,12,3,8;49,92,42,6,12,3,6;50,18,42,9,12,3,9;51,9,42,9,12,3,9;52,141,30,10,12,3,10;53,84,42,8,12,3,8;54,36,42,8,12,3,8;55,27,42,9,12,3,9;56,44,42,8,12,3,8;57,52,42,8,12,3,8;58,120,54,4,9,6,4;59,110,42,4,11,6,4;60,106,54,7,9,5,7;61,136,54,8,5,7,8;62,113,54,7,9,5,7;63,68,42,8,12,3,8;64,0,67,13,12,3,13;65,81,0,15,13,2,15;66,0,17,11,13,2,11;67,161,30,9,12,3,9;68,136,0,12,13,2,12;69,148,0,12,13,2,12;70,11,17,11,13,2,11;71,53,30,12,12,3,12;72,110,0,14,13,2,14;73,151,30,10,12,3,10;74,19,0,7,16,3,7;75,0,30,14,12,3,14;76,120,30,11,12,3,11;77,122,17,16,12,3,16;78,40,30,13,12,3,13;79,131,30,10,12,3,10;80,109,30,11,12,3,11;81,32,0,10,14,3,10;82,96,0,14,13,2,14;83,0,42,9,12,3,9;84,87,30,11,12,3,11;85,27,30,13,12,3,13;86,76,30,11,12,3,11;87,153,17,14,12,3,14;88,138,17,15,12,3,15;89,8,0,11,16,3,11;90,98,30,11,12,3,11;91,66,0,6,14,2,6;92,100,17,8,13,3,8;93,72,0,6,14,2,6;94,144,54,7,5,2,7;95,12,63,11,3,8,11;96,157,54,5,5,2,5;97,24,54,11,9,6,11;98,74,17,9,13,2,9;99,82,54,8,9,6,8;100,124,0,12,13,2,12;101,55,54,9,9,6,9;102,0,0,8,17,2,8;103,83,17,9,13,6,9;104,22,17,11,13,2,11;105,76,42,8,12,3,8;106,26,0,6,16,3,6;107,33,17,11,13,2,11;108,115,17,7,13,2,7;109,124,42,17,9,6,17;110,0,54,12,9,6,12;111,64,54,9,9,6,9;112,54,17,10,13,6,10;113,64,17,10,13,6,10;114,98,54,8,9,6,8;115,90,54,8,9,6,8;116,102,42,8,11,4,8;117,12,54,12,9,6,12;118,35,54,10,9,6,10;119,141,42,15,9,6,15;120,156,42,12,9,6,12;121,44,17,10,13,6,10;122,45,54,10,9,6,10;123,42,0,6,14,2,6;124,78,0,3,14,2,3;125,48,0,6,14,2,6;126,0,63,8,4,6,8";
		let C = {}, hdr = { face: "Venice16", size: 16, sw: 171, sh: 79, page: "Venice16.png" }, lh = 16, base = 13, sel = 65, img = new Image;
		const $ = i => document.getElementById(i), css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
		D.split(";").forEach(r => { const [a, x, y, w, h, yo, xa] = r.split(",").map(Number); C[a] = { x, y, w, h, xo: 0, yo, xa } });
		const L = c => String.fromCharCode(c);
		function grid() { $("grid").innerHTML = ""; Object.keys(C).forEach(k => { const b = document.createElement("button"); b.textContent = k == 32 ? "␣" : L(+k); b.className = k == sel ? "on" : ""; b.onclick = () => { sel = +k; draw() }; $("grid").appendChild(b) }) }
		function ctxOf(c, w, h) { c.width = w; c.height = h; const x = c.getContext("2d"); x.imageSmoothingEnabled = false; return x }
		function lbl(x, t, px, py, col) { x.fillStyle = col; x.font = "12px system-ui"; x.fillText(t, px, py) }
		function anat() {
			const c = C[sel], Z = 14, W = 24 * Z, H = (lh + 3) * Z, x = ctxOf($("anat"), W, H), ox = 4 * Z, oy = Z;
			x.fillStyle = css("--card"); x.fillRect(0, 0, W, H);
			x.fillStyle = "rgba(120,120,200,.12)"; x.fillRect(ox, oy, c.xa * Z, lh * Z);
			x.drawImage(img, c.x, c.y, c.w, c.h, ox + c.xo * Z, oy + c.yo * Z, c.w * Z, c.h * Z);
			x.setLineDash([4, 3]); x.strokeStyle = css("--mut"); x.strokeRect(ox + c.xo * Z + .5, oy + c.yo * Z + .5, c.w * Z, c.h * Z); x.setLineDash([]);
			const hl = (y, col, t) => { x.strokeStyle = col; x.lineWidth = 2; x.beginPath(); x.moveTo(Z, oy + y * Z); x.lineTo(W - Z, oy + y * Z); x.stroke(); lbl(x, t, W - Z * 9, oy + y * Z - 3, col) };
			const bottom = c.yo + c.h;
			hl(0, css("--r"), "top 0"); hl(base, css("--g"), "base " + base); hl(lh, css("--b"), "lineHeight " + lh); hl(bottom, css("--o"), "bottom " + bottom);
			x.strokeStyle = css("--acc"); x.lineWidth = 1; x.beginPath(); x.moveTo(ox + c.xa * Z, oy); x.lineTo(ox + c.xa * Z, oy + lh * Z); x.stroke();
			$("vb").textContent = base; $("vl").textContent = lh; $("xa").textContent = c.xa;
			const d = bottom - base;
			$("anaInfo").innerHTML = `<b>“${L(sel)}”</b><br>top-left = (xoffset, yoffset) = (${c.xo}, ${c.yo})<br>bottom = yoffset + height = ${c.yo} + ${c.h} = ${bottom}<br>baseline: ${d == 0 ? "on base" : (d > 0 ? d + "px below base" : (-d) + "px above base")}<br>xadvance = ${c.xa}`;
		}
		function prev() {
			const Z = +$("zm").value, lines = $("txt").value.split("\n"), W = Math.max(260, Math.min(980, lines.reduce((m, s) => Math.max(m, [...s].reduce((a, ch) => a + ((C[ch.charCodeAt(0)] || {}).xa || 0), 0)), 0) + 8)) * Z, x = ctxOf($("prev"), W, (lines.length * lh + 4) * Z);
			x.fillStyle = css("--card"); x.fillRect(0, 0, W, x.canvas.height);
			lines.forEach((s, i) => {
				const y0 = (2 + i * lh) * Z; let px = 4 * Z;
				if ($("gd").checked) { [[0, "--r"], [base, "--g"], [lh, "--b"]].forEach(([o, v]) => { x.fillStyle = css(v); x.globalAlpha = .7; x.fillRect(0, y0 + o * Z, W, 1); x.globalAlpha = 1 }) }
				for (const ch of s) { const c = C[ch.charCodeAt(0)]; if (!c) continue; x.drawImage(img, c.x, c.y, c.w, c.h, px + c.xo * Z, y0 + c.yo * Z, c.w * Z, c.h * Z); px += c.xa * Z }
			})
		}
		function atl() {
			const Z = 4, x = ctxOf($("atlas"), hdr.sw * Z, hdr.sh * Z); x.fillStyle = css("--card"); x.fillRect(0, 0, x.canvas.width, x.canvas.height); x.drawImage(img, 0, 0, hdr.sw * Z, hdr.sh * Z);
			const c = C[sel]; x.strokeStyle = css("--acc"); x.lineWidth = 2; x.strokeRect(c.x * Z, c.y * Z, c.w * Z, c.h * Z)
		}
		function sync() {
			const c = C[sel]; $("iyo").value = c.yo; $("ixo").value = c.xo; $("ixa").value = c.xa; $("ibase").value = base; $("ilh").value = lh;
			$("selinfo").textContent = `id ${sel} “${L(sel)}” ${c.w}×${c.h} @ ${c.x},${c.y}`
		}
		function checks() {
			const ds = $("dset").value, isD = s => ds.includes(s), al = s => /[A-Za-z0-9]/.test(s), bt = c => c.yo + c.h;
			const R = [["Above top", c => c.yo < 0, "yoffset < 0"],
			["Not on baseline", (c, s) => al(s) && !isD(s) && bt(c) !== base, "bottom ≠ base"],
			["Descender too high", (c, s) => isD(s) && bt(c) <= base, "tail ≤ base"],
			["Past lineHeight", c => bt(c) > lh, "overflows line box"],
			["Outside atlas", c => c.x < 0 || c.y < 0 || c.x + c.w > hdr.sw || c.y + c.h > hdr.sh, "leaves PNG"],
			["Advance too small", c => c.xa < c.xo + c.w, "wider than advance"]];
			const out = $("chk"), all = new Set; out.innerHTML = "";
			R.forEach(([t, f, h]) => {
				const bad = Object.keys(C).filter(k => f(C[k], L(+k))); bad.forEach(k => all.add(k)); const d = document.createElement("div");
				d.innerHTML = `<p><b>${bad.length ? "✗" : "✓"} ${t}</b> <span class="mut">(${bad.length}) ${h}</span></p>`;
				const w = document.createElement("div"); w.style.cssText = "display:flex;flex-wrap:wrap;gap:2px";
				bad.forEach(k => { const b = document.createElement("button"); b.textContent = k == 32 ? "␣" : L(+k); b.style.cssText = "flex:1 0 2em;min-width:2em;padding:2px 0" + (k == sel ? ";background:var(--acc);color:#fff" : ""); b.onclick = () => { sel = +k; draw() }; w.appendChild(b) });
				d.appendChild(w); out.appendChild(d)
			});
			$("sum").textContent = `${all.size}/${Object.keys(C).length} flagged`
		}
		$("fixb").onclick = () => { const ds = $("dset").value; Object.keys(C).forEach(k => { const s = L(+k), c = C[k]; if (/[A-Za-z0-9]/.test(s) && !ds.includes(s)) c.yo = base - c.h }); draw() };
		$("fixl").onclick = () => { lh = Math.max(...Object.values(C).map(c => c.yo + c.h)); draw() };
		$("norm").onclick = () => {
			const v = Object.values(C), dy = (+$("top").value) - Math.min(...v.map(c => c.yo)); v.forEach(c => c.yo += dy);
			const ds = $("dset").value, m = {}; Object.keys(C).forEach(k => { const s = L(+k); if (/[A-Za-z0-9]/.test(s) && !ds.includes(s)) { const b = C[k].yo + C[k].h; m[b] = (m[b] || 0) + 1 } });
			const t = Object.entries(m).sort((a, b) => b[1] - a[1])[0]; if (t) base = +t[0]; lh = Math.max(...v.map(c => c.yo + c.h)) + (+$("gap").value); draw()
		};
		$("dset").oninput = checks;
		function draw() { grid(); sync(); anat(); prev(); atl(); checks() }
		$("iyo").oninput = e => { C[sel].yo = +e.target.value; draw() }; $("ixo").oninput = e => { C[sel].xo = +e.target.value; draw() }; $("ixa").oninput = e => { C[sel].xa = +e.target.value; draw() };
		$("ibase").oninput = e => { base = +e.target.value; draw() }; $("ilh").oninput = e => { lh = +e.target.value; draw() };
		$("up").onclick = () => { C[sel].yo--; draw() }; $("dn").onclick = () => { C[sel].yo++; draw() };
		const G = { all: () => 1, up: s => /[A-Z]/.test(s), low: s => /[a-z]/.test(s), desc: s => /[gjpqy]/.test(s), nodesc: s => /[a-z]/.test(s) && !/[gjpqy]/.test(s), dig: s => /[0-9]/.test(s), pun: s => /[^A-Za-z0-9 ]/.test(s) };
		$("apply").onclick = () => { const f = G[$("grp").value], d = +$("dy").value; Object.keys(C).forEach(k => { if (f(L(+k))) C[k].yo += d }); draw() };
		["txt", "zm", "gd"].forEach(i => $(i).oninput = prev);
		$("atlas").onclick = e => {
			const r = e.target.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * hdr.sw, py = (e.clientY - r.top) / r.height * hdr.sh;
			const k = Object.keys(C).find(k => { const c = C[k]; return px >= c.x && px < c.x + c.w && py >= c.y && py < c.y + c.h }); if (k) { sel = +k; draw() }
		};
		addEventListener("keydown", e => {
			if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; const ks = Object.keys(C).map(Number), i = ks.indexOf(sel);
			if (e.key == "ArrowRight") sel = ks[Math.min(ks.length - 1, i + 1)]; else if (e.key == "ArrowLeft") sel = ks[Math.max(0, i - 1)]; else return; draw()
		});
		function out() {
			let s = `info face="${hdr.face}" size=${hdr.size}\ncommon lineHeight=${lh} base=${base} scaleW=${hdr.sw} scaleH=${hdr.sh} pages=1\npage id=0 file="${hdr.page}"\nchars count=${Object.keys(C).length}\n`;
			Object.keys(C).forEach(k => { const c = C[k], n = +k; s += `char id=${n}`.padEnd(11) + ` x=${c.x} y=${c.y} width=${c.w} height=${c.h} xoffset=${c.xo} yoffset=${c.yo} xadvance=${c.xa} page=0 chnl=0 letter="${n == 32 ? "space" : L(n)}"\n` }); return s
		}
		$("exp").onclick = () => { $("fnt").value = out() }; $("cp").onclick = () => { $("fnt").value = out(); try { navigator.clipboard.writeText($("fnt").value) } catch (e) { $("fnt").select() } };
		$("load").onclick = () => {
			const t = $("fnt").value, n = {}; const g = (s, k) => { const m = s.match(new RegExp("\\b" + k + '="?(-?[^\\s"]+)')); return m ? m[1] : null };
			t.split("\n").forEach(l => {
				if (/^char /.test(l)) { const id = +g(l, "id"); n[id] = { x: +g(l, "x"), y: +g(l, "y"), w: +g(l, "width"), h: +g(l, "height"), xo: +g(l, "xoffset"), yo: +g(l, "yoffset"), xa: +g(l, "xadvance") } }
				else if (/^common /.test(l)) { lh = +g(l, "lineHeight"); base = +g(l, "base"); hdr.sw = +g(l, "scaleW"); hdr.sh = +g(l, "scaleH") }
				else if (/^info /.test(l)) { hdr.face = g(l, "face") || hdr.face; hdr.size = +g(l, "size") || hdr.size }
				else if (/^page /.test(l)) { hdr.page = g(l, "file") || hdr.page }
			});
			if (Object.keys(n).length) { C = n; sel = +Object.keys(C)[0]; draw() }
		};
		$("png").onchange = e => { const f = e.target.files[0]; if (!f) return; hdr.page = f.name; img.onload = () => { hdr.sw = img.width; hdr.sh = img.height; draw() }; img.src = URL.createObjectURL(f) };
		img.onload = draw; img.src = IMG; draw();
	</script>
</body>
