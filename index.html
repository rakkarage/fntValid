<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>fntValid</title>
	<style>
		:root {
			--bg: #eceff3;
			--card: #fff;
			--ink: #1b2330;
			--mut: #6a7585;
			--line: #d8dde5;
			--acc: #5b4bdb;
			--g: #12a150;
			--b: #2b6fe0;
			--o: #e07a10;
			--r: #d93a3a;
			--p: #8a3ff0;
			--okbg: #e6f6ec;
			--badbg: #fdeaea;
			box-sizing: border-box;
			padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0)
		}

		@media(prefers-color-scheme:dark) {
			:root:not([data-theme="light"]) {
				--bg: #12141a;
				--card: #1b1e26;
				--ink: #e8ecf2;
				--mut: #98a2b3;
				--line: #2d323d;
				--acc: #9d90ff;
				--g: #3ddc84;
				--b: #6ea2ff;
				--o: #ffa04a;
				--r: #ff6b6b;
				--p: #b88aff;
				--okbg: #14301f;
				--badbg: #3a1a1d
			}
		}

		:root[data-theme="dark"] {
			--bg: #12141a;
			--card: #1b1e26;
			--ink: #e8ecf2;
			--mut: #98a2b3;
			--line: #2d323d;
			--acc: #9d90ff;
			--g: #3ddc84;
			--b: #6ea2ff;
			--o: #ffa04a;
			--r: #ff6b6b;
			--p: #b88aff;
			--okbg: #14301f;
			--badbg: #3a1a1d
		}

		* {
			box-sizing: border-box
		}

		body {
			margin: 0;
			background: var(--bg);
			color: var(--ink);
			font: 14px/1.45 system-ui, sans-serif
		}

		header {
			display: flex;
			align-items: center;
			gap: 10px;
			flex-wrap: wrap;
			padding: 12px 12px 0;
			max-width: 1400px;
			margin: 0 auto
		}

		h1 {
			font-size: 1.15rem;
			margin: 0;
			font-weight: 700;
			letter-spacing: -.01em;
			flex: 1
		}

		h1 span {
			color: var(--mut);
			font-weight: 400;
			font-size: .8em;
			margin-left: 8px
		}

		.pill {
			padding: 3px 12px;
			border-radius: 99px;
			font-weight: 700;
			font-size: .85em;
			color: #fff;
			background: var(--r)
		}

		.pill.ok {
			background: var(--g);
			color: #06210f
		}

		main {
			max-width: 1400px;
			margin: 0 auto;
			padding: 12px;
			columns: 440px;
			column-gap: 12px
		}

		.card {
			background: var(--card);
			border: 1px solid var(--line);
			border-radius: 12px;
			padding: 12px;
			margin: 0 0 12px;
			break-inside: avoid;
			box-shadow: 0 1px 2px rgba(20, 30, 50, .06)
		}

		.cardname {
			font-size: .8em;
			font-weight: 700;
			color: var(--mut);
			margin: 0 0 8px;
			display: flex;
			align-items: center;
			gap: 8px
		}

		.cardname .sp {
			flex: 1
		}

		canvas {
			display: block;
			image-rendering: pixelated;
			max-width: 100%;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--bg)
		}

		.sc {
			overflow-x: auto;
			overflow-y: hidden;
			line-height: 0
		}

		code {
			font-family: ui-monospace, monospace;
			font-size: .9em;
			background: var(--bg);
			padding: 1px 5px;
			border-radius: 5px
		}

		.dot {
			display: inline-block;
			width: 10px;
			height: 10px;
			border-radius: 50%;
			margin-left: 5px;
			vertical-align: middle
		}

		button,
		input,
		select,
		textarea {
			font: inherit;
			color: var(--ink);
			background: var(--card);
			border: 1px solid var(--line);
			border-radius: 8px;
			padding: 5px 9px
		}

		button {
			cursor: pointer;
			font-weight: 600;
			background: color-mix(in srgb, var(--acc) 10%, var(--card));
			border-color: color-mix(in srgb, var(--acc) 40%, var(--line));
			transition: background .12s
		}

		button:hover {
			background: color-mix(in srgb, var(--acc) 22%, var(--card));
			border-color: var(--acc)
		}

		button:active {
			transform: translateY(1px)
		}

		button:disabled {
			opacity: .4;
			cursor: default;
			pointer-events: none
		}

		button.pri {
			background: var(--acc);
			color: #fff;
			border-color: var(--acc)
		}

		:root:not([data-theme="light"]) button.pri {
			color: #11131a
		}

		:focus-visible {
			outline: 2px solid var(--acc);
			outline-offset: 1px
		}

		input[type=number] {
			width: 62px
		}

		input:focus,
		textarea:focus,
		select:focus {
			border-color: var(--acc)
		}

		textarea {
			width: 100%;
			font-family: ui-monospace, monospace;
			font-size: .8rem
		}

		label {
			display: inline-flex;
			gap: 5px;
			align-items: center;
			margin: 3px 8px 3px 0
		}

		.mut {
			color: var(--mut)
		}

		.warn {
			color: var(--o);
			font-weight: 600
		}

		.good {
			color: var(--g);
			font-weight: 600
		}

		p {
			margin: .35em 0
		}

		hr {
			border: 0;
			border-top: 1px solid var(--line);
			margin: 10px 0
		}

		.btns {
			display: flex;
			gap: 6px;
			flex-wrap: wrap;
			margin: 6px 0
		}

		.preview-box {
			position: relative
		}

		.preview-box canvas {
			width: 100%;
			height: auto
		}

		.overlay {
			position: absolute;
			padding: 5px 8px;
			border-radius: 8px;
			background: color-mix(in srgb, var(--card) 70%, transparent);
			backdrop-filter: blur(4px);
			font-size: .85em
		}

		.overlay p {
			margin: .2em 0
		}

		.overlay-top {
			top: 6px;
			left: 6px;
			text-align: left
		}

		.overlay-bottom {
			bottom: 6px;
			right: 6px;
			text-align: right
		}

		#grid {
			display: flex;
			flex-wrap: wrap;
			gap: 4px;
			max-height: 170px;
			overflow: auto;
			padding: 2px
		}

		#grid button {
			flex: 1 0 2.3em;
			min-width: 2.3em;
			height: 2.1em;
			padding: 0;
			font-family: ui-monospace, monospace;
			position: relative;
			background: var(--okbg);
			border-color: color-mix(in srgb, var(--g) 40%, var(--line))
		}

		#grid button.bad {
			background: var(--badbg);
			border-color: color-mix(in srgb, var(--r) 55%, var(--line))
		}

		#grid button.on {
			background: var(--acc);
			color: #fff;
			border-color: var(--acc);
			box-shadow: 0 0 0 2px color-mix(in srgb, var(--acc) 35%, transparent)
		}

		:root:not([data-theme="light"]) #grid button.on {
			color: #11131a
		}

		.chk {
			border-radius: 10px;
			padding: 7px 10px;
			margin: 6px 0;
			border: 1px solid;
			border-left-width: 5px
		}

		.chk.ok {
			background: var(--okbg);
			border-color: color-mix(in srgb, var(--g) 40%, var(--line));
			border-left-color: var(--g)
		}

		.chk.no {
			background: var(--badbg);
			border-color: color-mix(in srgb, var(--r) 40%, var(--line));
			border-left-color: var(--r)
		}

		.chk p {
			margin: 0;
			display: flex;
			gap: 8px;
			align-items: baseline
		}

		.chk .ic {
			font-weight: 800;
			width: 1.1em
		}

		.ok .ic {
			color: var(--g)
		}

		.no .ic {
			color: var(--r)
		}

		.chk .t {
			font-weight: 700
		}

		.chk .cnt {
			margin-left: auto;
			font-weight: 700
		}

		.chips {
			display: flex;
			flex-wrap: wrap;
			gap: 3px;
			margin-top: 6px
		}

		.chips button {
			flex: 0 0 auto;
			min-width: 2em;
			padding: 2px 6px;
			background: var(--card);
			border-color: var(--r);
			color: var(--r)
		}

		.chips button.on {
			background: var(--r);
			color: #fff
		}
	</style>
</head>

<body>
	<header>
		<h1>fntValid<span id="fname"></span></h1>
		<span class="pill" id="sum"></span>
		<button id="undo" title="Ctrl/Cmd+Z">Undo</button>
		<button id="redo" title="Ctrl/Cmd+Shift+Z">Redo</button>
		<button id="theme">Theme</button>
	</header>
	<main>
		<div class="card">
			<p class="cardname">Character <span class="sp"></span><span class="mut">← → switch glyph · ↑ ↓ nudge</span>
			</p>
			<div class="preview-box">
				<div class="sc"><canvas id="anat"></canvas></div>
				<div class="overlay overlay-top" id="anaInfo"></div>
				<div class="overlay overlay-bottom">
					<p><code>0</code> top<span class="dot" style="background:var(--r)"></span></p>
					<p><code id="vb"></code> base<span class="dot" style="background:var(--g)"></span></p>
					<p><code id="vl"></code> lineHeight<span class="dot" style="background:var(--b)"></span></p>
					<p><span id="vbd" style="font-weight:700"></span> <code id="vbot"></code> bottom<span class="dot"
							style="background:var(--o)"></span></p>
					<p><code id="xa"></code> xadvance<span class="dot" style="background:var(--p)"></span></p>
				</div>
			</div>
		</div>

		<div class="card" id="settings">
			<p class="cardname">Settings</p>
			<p class="mut">Click the atlas or a glyph to select. Red glyphs fail a check.</p>
			<div class="sc"><canvas id="atlas"></canvas></div>
			<div id="grid"></div>
			<p id="selinfo" class="mut"></p>
			<label>yoffset <input type="number" id="iyo"></label>
			<label>xoffset <input type="number" id="ixo"></label>
			<label>xadvance <input type="number" id="ixa"></label>
			<hr>
			<select id="grp">
				<option value="all">all</option>
				<option value="up">A-Z</option>
				<option value="low">a-z</option>
				<option value="desc">descenders g j p q y</option>
				<option value="nodesc">a-z no descenders</option>
				<option value="dig">0-9</option>
				<option value="pun">punctuation</option>
			</select>
			<label>Δy <input type="number" id="dy" value="-1"></label><button id="apply">Apply</button>
			<br><label>base <input type="number" id="ibase"></label><label>lineHeight <input type="number"
					id="ilh"></label>
		</div>

		<div class="card" id="checkcard">
			<p class="cardname">Checks</p>
			<label>descenders <input id="dset" value="gjpqy" size="6"></label>
			<label>top gap <input type="number" id="top" value="0"></label>
			<label>bottom gap <input type="number" id="gap" value="0"></label>
			<div class="btns"><button class="pri" id="fix"
					title="Snap baseline and descenders, apply top gap, fit lineHeight">Auto-fix</button></div>
			<div id="chk"></div>
		</div>

		<div class="card" id="filecard">
			<p class="cardname">Font file</p>
			<textarea id="fnt" rows="8" spellcheck="false" placeholder="Paste .fnt here"></textarea>
			<div class="btns">
				<button id="open" class="pri">Open .fnt + .png…</button>
				<input type="file" id="files" accept=".fnt,.txt,.png,image/png" multiple hidden>
				<button id="load">Load .fnt</button>
				<button id="exp">Export</button>
				<button id="cp">Copy</button>
				<button id="dl">Download .fnt</button>
			</div>
			<p class="mut" id="hint">Drop a .fnt and/or its .png anywhere on this page, or open both together.</p>
			<div class="btns" style="margin-top:8px">
				<button class="pri" id="demo1">Load Demo 1 (Venice16)</button>
				<button class="pri" id="demo2">Load Demo 2 (Super12)</button>
			</div>
		</div>
	</main>
	<script>
		let C = {}, hdr = { face: "", size: 0, sw: 0, sh: 0, page: "" }, lh = 0, base = 0, sel = 65, img = new Image, bad = new Set, hist = [], fut = [], lastKey = null, lastT = 0, pend = null;
		const $ = i => document.getElementById(i), css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
		const L = c => String.fromCharCode(c);
		const glyphName = k => k == 32 ? "␣" : L(+k);
		const state = () => JSON.stringify({ C, base, lh });
		function snap(key) {
			const now = Date.now(), st = state(); pend = null;
			if (key && key === lastKey && now - lastT < 800) { lastT = now; fut = []; return }
			lastKey = key || null; lastT = now;
			if (hist[hist.length - 1] === st) return;
			hist.push(st); fut = []; pend = st; if (hist.length > 60) hist.shift()
		}
		function drop() { if (pend !== null) { hist.pop(); pend = null } }
		function restore(st) { const o = JSON.parse(st); C = o.C; base = o.base; lh = o.lh; lastKey = null; pend = null; if (!C[sel]) sel = C[65] ? 65 : +Object.keys(C)[0]; draw() }
		function undo() { const st = hist.pop(); if (!st) return; fut.push(state()); restore(st) }
		function redo() { const st = fut.pop(); if (!st) return; hist.push(state()); restore(st) }
		function grid() { $("grid").innerHTML = ""; Object.keys(C).forEach(k => { const b = document.createElement("button"); b.textContent = glyphName(k); b.className = (bad.has(k) ? "bad " : "") + (k == sel ? "on" : ""); b.title = "id " + k; b.onclick = () => { sel = +k; draw() }; $("grid").appendChild(b) }) }
		function ctxOf(c, w, h) { c.width = w; c.height = h; const x = c.getContext("2d"); x.imageSmoothingEnabled = false; return x }
		function anat() {
			const c = C[sel], Z = 28, W = 24 * Z, H = (lh + 3) * Z, x = ctxOf($("anat"), W, H), ox = 4 * Z, oy = Z;
			x.fillStyle = css("--card"); x.fillRect(0, 0, W, H);
			x.fillStyle = "rgba(120,120,200,.12)"; x.fillRect(ox, oy, c.xa * Z, lh * Z);
			x.drawImage(img, c.x, c.y, c.w, c.h, ox + c.xo * Z, oy + c.yo * Z, c.w * Z, c.h * Z);
			x.setLineDash([4, 3]); x.strokeStyle = css("--mut"); x.strokeRect(ox + c.xo * Z + .5, oy + c.yo * Z + .5, c.w * Z, c.h * Z); x.setLineDash([]);
			const hl = (y, col, parts) => { x.strokeStyle = col; x.lineWidth = 2; x.beginPath(); x.moveTo(Z, oy + y * Z); x.lineTo(W - Z, oy + y * Z); x.stroke(); let px = W - Z * 9, py = oy + y * Z - 3; x.font = "12px system-ui"; parts.forEach(p => { x.fillStyle = p.col; x.fillText(p.t, px, py); px += x.measureText(p.t).width }) };
			const bottom = c.yo + c.h;
			const guides = [{ y: 0, n: "top", v: 0, col: css("--r") }, { y: base, n: "base", v: base, col: css("--g") }, { y: lh, n: "lineHeight", v: lh, col: css("--b") }, { y: bottom, n: "bottom", v: bottom, col: css("--o") }];
			const gs = [];
			guides.forEach(g => { const o = gs.find(e => e.y === g.y); if (o) o.items.push(g); else gs.push({ y: g.y, v: g.v, items: [g] }) });
			gs.forEach(g => {
				const lcol = g.items.length > 1 ? (g.items.find(i => i.n === "base") || g.items[0]).col : g.items[0].col;
				const parts = []; g.items.forEach((it, i) => { if (i) parts.push({ t: ", ", col: it.col }); parts.push({ t: it.n, col: it.col }) }); parts.push({ t: " " + g.v, col: lcol });
				hl(g.y, lcol, parts);
			});
			x.strokeStyle = css("--p"); x.lineWidth = 2; x.beginPath(); x.moveTo(ox + c.xa * Z, oy); x.lineTo(ox + c.xa * Z, oy + lh * Z); x.stroke();
			const d = bottom - base;
			$("vb").textContent = base; $("vl").textContent = lh; $("vbot").textContent = bottom; $("xa").textContent = c.xa;
			$("vbd").textContent = d ? (d > 0 ? `+${d}px ` : `${d}px `) : "";
			$("vbd").className = d ? "warn" : "good";
			$("anaInfo").innerHTML = `<b style="font-size:1.6em">“${L(sel)}”</b> <span class="mut">id ${sel}</span>`;
		}
		function atl() {
			const Z = 4, x = ctxOf($("atlas"), hdr.sw * Z, hdr.sh * Z); x.fillStyle = css("--card"); x.fillRect(0, 0, x.canvas.width, x.canvas.height); x.drawImage(img, 0, 0, hdr.sw * Z, hdr.sh * Z);
			x.fillStyle = "rgba(217,58,58,.28)"; bad.forEach(k => { const c = C[k]; if (c) x.fillRect(c.x * Z, c.y * Z, c.w * Z, c.h * Z) });
			const c = C[sel]; x.strokeStyle = css("--acc"); x.lineWidth = 2; x.strokeRect(c.x * Z, c.y * Z, c.w * Z, c.h * Z)
		}
		function sync() {
			const c = C[sel]; $("iyo").value = c.yo; $("ixo").value = c.xo; $("ixa").value = c.xa; $("ibase").value = base; $("ilh").value = lh;
			$("selinfo").textContent = `id ${sel} “${L(sel)}” ${c.w}×${c.h} @ ${c.x},${c.y}`; $("fname").textContent = `${hdr.face} · ${hdr.size}px`
		}
		function checks() {
			const ds = $("dset").value, isD = s => ds.includes(s), al = s => /[A-Za-z0-9]/.test(s), bt = c => c.yo + c.h;
			const R = [["Above top", c => c.yo < 0, "yoffset < 0"],
			["Not on baseline", (c, s) => al(s) && !isD(s) && bt(c) !== base, "bottom ≠ base"],
			["Descender too high", (c, s) => isD(s) && bt(c) <= base, "tail ≤ base"],
			["Past lineHeight", c => bt(c) > lh, "overflows line box"],
			["Outside atlas", c => c.x < 0 || c.y < 0 || c.x + c.w > hdr.sw || c.y + c.h > hdr.sh, "leaves PNG"],
			["Advance too small", c => c.xa < c.xo + c.w, "wider than advance"]];
			const out = $("chk"); bad = new Set; out.innerHTML = ""; let fails = 0;
			const row = (ok, t, h, cnt, keys) => {
				if (!ok) fails++;
				const d = document.createElement("div"); d.className = "chk " + (ok ? "ok" : "no");
				d.innerHTML = `<p><span class="ic">${ok ? "✓" : "✗"}</span><span class="t">${t}</span><span class="mut">${h}</span>${cnt == null ? "" : `<span class="cnt" style="color:var(${ok ? "--g" : "--r"})">${cnt}</span>`}</p>`;
				if (keys && keys.length) { const w = document.createElement("div"); w.className = "chips"; keys.forEach(k => { const b = document.createElement("button"); b.textContent = glyphName(k); b.className = k == sel ? "on" : ""; b.onclick = () => { sel = +k; draw() }; w.appendChild(b) }); d.appendChild(w) }
				out.appendChild(d)
			};
			R.forEach(([t, f, h]) => { const b = Object.keys(C).filter(k => f(C[k], L(+k))); b.forEach(k => bad.add(k)); row(!b.length, t, h, b.length, b) });
			const v = Object.values(C);
			if (v.length) {
				const minY = Math.min(...v.map(c => c.yo)), maxB = Math.max(...v.map(c => c.yo + c.h));
				const top = +$("top").value, gap = +$("gap").value;
				row(minY === top, "Top edge aligned", minY === top ? "highest glyph at top gap" : `highest glyph at top gap · expected ${top}, got ${minY}`);
				row(lh === maxB + gap, "Line height fits", lh === maxB + gap ? "lowest glyph + bottom gap" : `lowest glyph + bottom gap · expected ${maxB + gap}, got ${lh}`);
			}
			const s = $("sum"); s.textContent = bad.size ? `${bad.size}/${Object.keys(C).length} glyphs flagged` : (fails ? "line box needs a fix" : "All checks pass"); s.className = "pill" + (fails ? "" : " ok")
		}
		function modeOf(a) { const m = {}; a.forEach(v => m[v] = (m[v] || 0) + 1); const t = Object.entries(m).sort((a, b) => b[1] - a[1])[0]; return t ? +t[0] : null }
		function autoFix() {
			snap();
			const ds = $("dset").value, top = +$("top").value, gap = +$("gap").value;
			const keys = Object.keys(C);
			const flat = k => { const s = L(+k); return /[A-Za-z0-9]/.test(s) && !ds.includes(s) };
			const b0 = modeOf(keys.filter(flat).map(k => C[k].yo + C[k].h));
			if (b0 == null) { drop(); return }
			keys.filter(flat).forEach(k => { C[k].yo = b0 - C[k].h });
			const xTop = modeOf(keys.filter(k => flat(k) && /[a-z]/.test(L(+k))).map(k => C[k].yo));
			if (xTop != null) {
				keys.forEach(k => {
					const s = L(+k);
					if (!/[A-Za-z]/.test(s) || !ds.includes(s)) return;
					if (s === "j" && C[105]) C[k].yo = C[105].yo;
					else C[k].yo = xTop;
				});
			}
			const dy = top - Math.min(...keys.map(k => C[k].yo));
			keys.forEach(k => { C[k].yo += dy }); base = b0 + dy;
			lh = Math.max(...keys.map(k => C[k].yo + C[k].h)) + gap;
			draw();
		}
		$("fix").onclick = autoFix;
		$("dset").oninput = draw; $("top").oninput = checks; $("gap").oninput = checks;
		const hasChars = () => Object.keys(C).length > 0;
		function draw() {
			if (pend !== null && state() === pend) { hist.pop(); fut = []; }
			pend = null;
			$("undo").disabled = !hist.length; $("redo").disabled = !fut.length;
			if (!hasChars()) {
				$("sum").textContent = "No font loaded";
				$("sum").className = "pill";
				$("chk").innerHTML = "";
				$("grid").innerHTML = "";
				$("selinfo").textContent = "Load a .fnt + .png, or use a demo.";
				$("anaInfo").innerHTML = "";
				$("vb").textContent = ""; $("vl").textContent = ""; $("vbot").textContent = ""; $("xa").textContent = ""; $("vbd").textContent = "";
				document.querySelector(".overlay-top").style.display = "none";
				document.querySelector(".overlay-bottom").style.display = "none";
				$("atlas").getContext("2d").clearRect(0, 0, $("atlas").width, $("atlas").height);
				$("anat").getContext("2d").clearRect(0, 0, $("anat").width, $("anat").height);
				return;
			}
			document.querySelector(".overlay-top").style.display = "";
			document.querySelector(".overlay-bottom").style.display = "";
			checks(); grid(); sync(); anat(); atl()
		}
		const edit = (fn, k) => e => { if (!hasChars()) return; snap(typeof k == "function" ? k() : k); fn(e); draw() };
		$("iyo").oninput = edit(e => C[sel].yo = +e.target.value, () => "yo" + sel); $("ixo").oninput = edit(e => C[sel].xo = +e.target.value, () => "xo" + sel); $("ixa").oninput = edit(e => C[sel].xa = +e.target.value, () => "xa" + sel);
		$("ibase").oninput = edit(e => base = +e.target.value, "base"); $("ilh").oninput = edit(e => lh = +e.target.value, "lh");
		$("apply").onclick = () => { if (!hasChars()) return; snap(); const f = G[$("grp").value], d = +$("dy").value; Object.keys(C).forEach(k => { if (f(L(+k))) C[k].yo += d }); draw() };
		$("undo").onclick = undo; $("redo").onclick = redo;
		$("theme").onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme:dark)").matches; r.dataset.theme = dark ? "light" : "dark"; draw() };
		const G = { all: () => 1, up: s => /[A-Z]/.test(s), low: s => /[a-z]/.test(s), desc: s => /[gjpqy]/.test(s), nodesc: s => /[a-z]/.test(s) && !/[gjpqy]/.test(s), dig: s => /[0-9]/.test(s), pun: s => /[^A-Za-z0-9 ]/.test(s) };
		/* apply handler set above */
		$("atlas").onclick = e => {
			if (!hasChars()) return;
			const r = e.target.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * hdr.sw, py = (e.clientY - r.top) / r.height * hdr.sh;
			const k = Object.keys(C).find(k => { const c = C[k]; return px >= c.x && px < c.x + c.w && py >= c.y && py < c.y + c.h }); if (k) { sel = +k; draw() }
		};
		addEventListener("keydown", e => {
			if ((e.ctrlKey || e.metaKey) && !/TEXTAREA/.test(e.target.tagName)) {
				const k = e.key.toLowerCase();
				if (k === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return }
				if (k === "y") { e.preventDefault(); redo(); return }
			}
			if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || !hasChars()) return; const ks = Object.keys(C).map(Number), i = ks.indexOf(sel);
			if (e.key == "ArrowRight") sel = ks[Math.min(ks.length - 1, i + 1)]; else if (e.key == "ArrowLeft") sel = ks[Math.max(0, i - 1)];
			else if (e.key == "ArrowUp") { snap("nudge" + sel); C[sel].yo-- } else if (e.key == "ArrowDown") { snap("nudge" + sel); C[sel].yo++ } else return; e.preventDefault(); draw()
		});
		function out() {
			let s = `info face="${hdr.face}" size=${hdr.size}\ncommon lineHeight=${lh} base=${base} scaleW=${hdr.sw} scaleH=${hdr.sh} pages=1\npage id=0 file="${hdr.page}"\nchars count=${Object.keys(C).length}\n`;
			Object.keys(C).map(Number).sort((a, b) => a - b).forEach(n => {
				const c = C[n];
				const letter = n == 32 ? "space" : L(n);
				s += `char id=${String(n).padEnd(3)} x=${String(c.x).padStart(3)} y=${String(c.y).padStart(3)} width=${String(c.w).padStart(2)} height=${String(c.h).padStart(2)} xoffset=${String(c.xo).padStart(2)} yoffset=${String(c.yo).padStart(2)} xadvance=${String(c.xa).padStart(2)} page=0 chnl=0 letter="${letter}"\n`;
			});
			return s
		}
		$("exp").onclick = () => { $("fnt").value = out() }; $("cp").onclick = () => { $("fnt").value = out(); try { navigator.clipboard.writeText($("fnt").value) } catch (e) { $("fnt").select() } };
		function parseFnt(t, basePath, skipImg) {
			const n = {}, h = { ...hdr }; let nl = lh, nb = base;
			const g = (s, k) => { const m = s.match(new RegExp("\\b" + k + '="?(-?[^\\s"]+)')); return m ? m[1] : null };
			t.split("\n").forEach(l => {
				if (/^char /.test(l)) { const id = +g(l, "id"); n[id] = { x: +g(l, "x"), y: +g(l, "y"), w: +g(l, "width"), h: +g(l, "height"), xo: +g(l, "xoffset"), yo: +g(l, "yoffset"), xa: +g(l, "xadvance") } }
				else if (/^common /.test(l)) { nl = +g(l, "lineHeight"); nb = +g(l, "base"); h.sw = +g(l, "scaleW"); h.sh = +g(l, "scaleH") }
				else if (/^info /.test(l)) { h.face = g(l, "face") || h.face; h.size = +g(l, "size") || h.size }
				else if (/^page /.test(l)) { h.page = g(l, "file") || h.page }
			});
			if (!Object.keys(n).length) return false;
			C = n; lh = nl; base = nb; hdr = h; sel = C[65] ? 65 : +Object.keys(C)[0];
			if (hdr.page && !skipImg) { const dir = basePath ? basePath.replace(/[^/]*$/, "") : ""; img.onload = draw; img.src = dir + hdr.page }
			else draw();
			return true
		}
		$("load").onclick = () => { snap(); if (parseFnt($("fnt").value)) draw(); else drop() };
		let pendingFnt = null, pendingPng = null;
		const loadImg = f => new Promise(res => {
			img.onload = () => { hdr.sw = img.width; hdr.sh = img.height; res() };
			img.src = URL.createObjectURL(f);
		});
		async function openFiles(list) {
			const fs = [...(list || [])];
			const fnt = fs.find(f => /\.(fnt|txt)$/i.test(f.name));
			const png = fs.find(f => /\.png$/i.test(f.name) || f.type === "image/png");
			if (fnt) pendingFnt = await fnt.text();
			if (png) { pendingPng = png; await loadImg(png); }
			img.onload = draw;
			if (pendingFnt != null && pendingPng) {
				snap();
				$("fnt").value = pendingFnt;
				if (parseFnt(pendingFnt, null, true)) { hdr.sw = img.width; hdr.sh = img.height; draw(); $("hint").textContent = `Loaded ${fnt ? fnt.name : ".fnt"} + ${png.name}.` }
				else { drop(); $("hint").textContent = "Could not parse .fnt." }
			} else if (pendingFnt != null) {
				snap();
				$("fnt").value = pendingFnt;
				if (parseFnt(pendingFnt, null, true)) $("hint").textContent = "Loaded .fnt. Now add the matching .png (or drop/open both together).";
				else { drop(); $("hint").textContent = "Could not parse .fnt." }
			} else if (pendingPng) {
				$("hint").textContent = `Loaded ${png.name}. Now add the matching .fnt.`;
			}
		}
		$("open").onclick = () => $("files").click();
		$("files").onchange = e => { openFiles(e.target.files); e.target.value = "" };
		addEventListener("dragover", e => { if (e.dataTransfer && [...e.dataTransfer.types || []].includes("Files")) e.preventDefault() });
		addEventListener("drop", e => { if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) { e.preventDefault(); openFiles(e.dataTransfer.files) } });
		$("fnt").addEventListener("paste", () => setTimeout(() => { snap(); if (parseFnt($("fnt").value)) draw(); else drop() }));
		$("dl").onclick = () => {
			if (!hasChars()) return;
			$("fnt").value = out();
			const a = document.createElement("a");
			a.href = URL.createObjectURL(new Blob([$("fnt").value], { type: "text/plain" }));
			a.download = ((hdr.face || "font").replace(/[^\w.-]+/g, "_") || "font") + ".fnt";
			a.click();
			setTimeout(() => URL.revokeObjectURL(a.href), 1000);
		};
		async function loadDemo(path, name) {
			try {
				const r = await fetch(path);
				if (!r.ok) throw r.status;
				const t = await r.text();
				snap();
				$("fnt").value = t;
				if (parseFnt(t, path)) $("hint").textContent = `Loaded demo ${name}.`;
				else { drop(); $("hint").textContent = `Could not parse demo ${name}.` }
			} catch (e) {
				drop();
				console.error("Failed to load demo", path, e);
				$("hint").textContent = `Could not load demo ${name}. If opened as a local file, use a local server or Open .fnt + .png….`;
			}
		}
		$("demo1").onclick = () => loadDemo("Font/Venice16.fnt", "Venice16");
		$("demo2").onclick = () => loadDemo("Font/Super12.fnt", "Super12");
		img.onload = draw;
		draw();
	</script>
</body>

</html>
